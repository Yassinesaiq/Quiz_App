{% extends 'base.html' %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container mt-5">
    <h2>{{ title }}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Speichern</button>
        <button type="submit" name="save_continue" class="btn btn-success"><i class="bi bi-pencil-square"></i> Speichern & neue Frage</button>
        <a href="{% url 'topics_list' %}" class="btn btn-secondary"><i class="bi bi-x-square"></i> Abbrechen</a>
    </form>

    <!-- Hier die Grafik -->
    <div class="mt-5">
        <canvas id="myChart" style="max-width: 100%; height: 300px;"></canvas>
    </div>
</div>

<script>
  // Daten vom Backend übergeben (angenommen, chart_labels und chart_data sind im Kontext)
  const labels = {{ chart_labels|safe }};
  const data = {{ chart_data|safe }};

  const ctx = document.getElementById('myChart').getContext('2d');
  new Chart(ctx, {
      type: 'line',  // z.B. Linienchart, du kannst auch 'bar' oder 'pie' nehmen
      data: {
          labels: labels,
          datasets: [{
              label: 'Deine Daten',
              data: data,
              fill: false,
              borderColor: 'rgb(75, 192, 192)',
              tension: 0.1
          }]
      },
      options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
              y: {
                  beginAtZero: true
              }
          }
      }
  });
</script>
</body>
</html>
{% endblock %}
