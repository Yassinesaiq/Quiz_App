{% extends "base.html" %}
{% block content %}
<style>
    .card-grid {
        display: flex;
        justify-content: center;
        gap: 40px;
        margin-top: 40px;
        flex-wrap: wrap;
    }
    .type-card {
        width: 350px;
        background: #fff;
        border-radius: 20px;
        box-shadow: rgba(0, 0, 0, 0.15) 0px 12px 24px;
        text-align: center;
        padding: 40px 30px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        border: 3px solid #ff2a0c;
    }
    .type-card:hover {
        transform: translateY(-8px) scale(1.03);
        box-shadow: rgba(0, 0, 0, 0.25) 0px 18px 32px;
        border-color: #37018d;
        color:rgba(0, 0, 0, 0.15);
    }
    .type-card h3 {
        margin-top: 20px;
        color: #ff2a0c;
        font-weight: bold;
        font-size: 2rem;
    }
    .type-card p {
        font-size: 1.1rem;
        color: #555;
        margin-top: 10px;
    }
    .type-card i {
        font-size: 60px;
        color: #37018d;
        margin-bottom: 10px;
    }
</style>

<h2 class="text-center">Neues Thema erstellen</h2>
<p class="text-center">Wähle den Typ des Themas aus:</p>

<form method="post">
    {% csrf_token %}
    <div class="card-grid">
        <button type="submit" name="choice" value="MCQ" class="type-card">
            <i class="bi bi-ui-checks-grid"></i>
            <h3>MCQ</h3>
            <p>Mehrfachauswahlfragen</p>
        </button>

        <button type="submit" name="choice" value="Textfrage" class="type-card">
            <i class="bi bi-file-richtext"></i>
            <h3>Textfrage</h3>
            <p>Offene Fragen mit manueller Bewertung</p>
        </button>

        <button type="submit" name="choice" value="MCQ + Text" class="type-card">
            <i class="bi bi-ui-checks-grid"></i>
            <i class="bi bi-file-richtext"></i>
            <h3>MCQ + Text</h3>
            <p>Kombination aus MCQ und Textfragen</p>
        </button>
    </div>
</form>
{% endblock %}
